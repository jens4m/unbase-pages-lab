name: Probe API permissions

# Run by hand. Calls the REST API with the run's GITHUB_TOKEN (a GitHub App installation token)
# under different permission sets and prints, per endpoint, the HTTP status and the
# X-Accepted-GitHub-Permissions header. Classic OAuth tokens never get that header.
on:
  workflow_dispatch:

jobs:
  read-all:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      deployments: read
      issues: read
      packages: read
      pages: read
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SET: read-all
        run: bash .github/scripts/probe.sh

  none:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: curl -sS -o probe.sh https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/scripts/probe.sh
      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SET: none
        run: bash probe.sh

  contents-read:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SET: contents-read
        run: bash .github/scripts/probe.sh

  pages-read:
    runs-on: ubuntu-latest
    permissions:
      pages: read
    steps:
      - run: curl -sS -o probe.sh https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/scripts/probe.sh
      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SET: pages-read
        run: bash probe.sh

  deployments-read:
    runs-on: ubuntu-latest
    permissions:
      deployments: read
    steps:
      - run: curl -sS -o probe.sh https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/scripts/probe.sh
      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SET: deployments-read
        run: bash probe.sh

  actions-read:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - run: curl -sS -o probe.sh https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/scripts/probe.sh
      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SET: actions-read
        run: bash probe.sh
